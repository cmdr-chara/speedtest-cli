name: Fix v0.4 cfg gates

on:
  push:
    branches:
      - agent/v0.4-dns-doctor-compare

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.4-dns-doctor-compare

      - name: Apply target-specific cfg gates
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/dns/system.rs")
          text = path.read_text()

          text = text.replace(
              'use std::{\n    fs,\n    net::IpAddr,\n    process::{Command, Output},\n};',
              'use std::{\n    net::IpAddr,\n    process::{Command, Output},\n};\n\n#[cfg(all(unix, not(target_os = "macos")))]\nuse std::fs;'
          )
          text = text.replace(
              '#[cfg(any(target_os = "windows", target_os = "macos"))]\n#[cfg(any(target_os = "windows", target_os = "macos"))]\nfn parse_ip_list',
              '#[cfg(any(target_os = "windows", target_os = "macos"))]\nfn parse_ip_list'
          )
          text = text.replace(
              'fn command_available(command: &str) -> bool {',
              '#[cfg(all(unix, not(target_os = "macos")))]\nfn command_available(command: &str) -> bool {'
          )
          text = text.replace(
              '#[cfg(target_os = "macos")]\n#[cfg(target_os = "macos")]\nfn value_after_colon',
              '#[cfg(target_os = "macos")]\nfn value_after_colon'
          )
          text = text.replace(
              'fn token_after(text: &str, key: &str) -> Option<String> {',
              '#[cfg(all(unix, not(target_os = "macos")))]\nfn token_after(text: &str, key: &str) -> Option<String> {'
          )
          text = text.replace(
              'fn is_true(value: &str) -> bool {',
              '#[cfg(all(unix, not(target_os = "macos")))]\nfn is_true(value: &str) -> bool {'
          )
          text = text.replace(
              '    #[test]\n    fn parses_route_tokens() {',
              '    #[cfg(all(unix, not(target_os = "macos")))]\n    #[test]\n    fn parses_route_tokens() {'
          )
          text = text.replace(
              '    #[cfg(target_os = "macos")]\n    #[cfg(target_os = "macos")]\n    #[test]\n    fn parses_colon_values()',
              '    #[cfg(target_os = "macos")]\n    #[test]\n    fn parses_colon_values()'
          )

          path.write_text(text)

      - name: Commit cfg fix
        shell: bash
        run: |
          if git diff --quiet -- src/dns/system.rs; then
            echo "cfg gates already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/dns/system.rs
          git commit -m "Fix platform-specific DNS cfg gates"
          git push origin HEAD:agent/v0.4-dns-doctor-compare
