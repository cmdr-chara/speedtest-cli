name: Cockpit visual captures

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cockpit-visuals.yml"
      - "docs/images/readme/render_gallery.py"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture actual renderer fixtures
        env:
          COCKPIT_SNAPSHOT_DIR: ${{ runner.temp }}/cockpit-review
          READABILITY_SNAPSHOT_DIR: ${{ runner.temp }}/cockpit-readability
          COCKPIT_MOTION_SNAPSHOT_DIR: ${{ runner.temp }}/cockpit-motion
        run: cargo test --locked --lib capture_
      - name: Install screenshot renderer dependencies
        run: |
          python -m pip install Pillow==12.3.0
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-core
      - name: Render current gallery
        env:
          COCKPIT_SNAPSHOT_DIR: ${{ runner.temp }}/cockpit-review
          READABILITY_SNAPSHOT_DIR: ${{ runner.temp }}/cockpit-readability
          COCKPIT_MOTION_SNAPSHOT_DIR: ${{ runner.temp }}/cockpit-motion
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          source = Path("docs/images/design/render_gallery.py")
          spec = importlib.util.spec_from_file_location("gallery", source)
          gallery = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gallery)
          out = Path("verification/cockpit-gallery")
          out.mkdir(parents=True, exist_ok=True)
          stills = Path(os.environ["READABILITY_SNAPSHOT_DIR"])
          motion = Path(os.environ["COCKPIT_MOTION_SNAPSHOT_DIR"])
          for root in (stills, motion):
              for path in root.rglob("*.json"):
                  data = json.loads(path.read_text())
                  text = "".join(cell["symbol"] for cell in data["cells"])
                  assert "MEASURING" not in text, path
          gallery.stills(stills, out, "after")
          gallery.RASTER.gif(
              motion / "live",
              out / "live-motion.gif",
              "LIVE COCKPIT | synthetic download, upload, and result reveal",
          )
          source = Path("docs/images/readme/render_gallery.py")
          spec = importlib.util.spec_from_file_location("readme_gallery", source)
          readme = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(readme)
          readme.render(stills, Path(os.environ["COCKPIT_SNAPSHOT_DIR"]), motion, out / "readme")
          (out / "source-sha.txt").write_text(os.environ["GITHUB_SHA"] + "\n")
          print("Captured badge-free frames and rendered current gallery.")
          PY
      - name: Upload actual renderer previews
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-gallery
          path: verification/cockpit-gallery/
          if-no-files-found: error
          retention-days: 7
