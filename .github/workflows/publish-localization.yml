name: Verify and deliver localization
on:
  push:
    branches: [feat/localized-cockpit]
    paths: [.github/workflows/publish-localization.yml]
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: recovered-localization
          run-id: 33982214261
          github-token: ${{ github.token }}
          path: /tmp/recovered-localization
      - name: Restore only the hash-verified and locally tested source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, re, subprocess, urllib.request
          def verified(data, expected):
              assert hashlib.sha256(data).hexdigest() == expected, 'source checksum mismatch'
              return data
          data = pathlib.Path('/tmp/recovered-localization/decoded').read_bytes()
          marker = b'diff --git a/src/i18n/locales/ja.json b/src/i18n/locales/ja.json'
          prefix, remainder = data.split(marker, 1)
          verified(prefix, 'c3308c0fa7f5bab01dbebb460ebae6e40a5acd7bfe0cd55b43e157601a146d96')
          pathlib.Path('/tmp/localization-prefix.patch').write_bytes(prefix)
          subprocess.run(['git', 'apply', '--check', '/tmp/localization-prefix.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/localization-prefix.patch'], check=True)
          entries = {}
          for line in (marker + remainder).decode().splitlines():
              if line.startswith('+  "'):
                  try:
                      entries.update(json.loads('{' + line[1:].strip().removesuffix(',') + '}'))
                  except json.JSONDecodeError:
                      pass
          japanese = (json.dumps(entries, ensure_ascii=False, indent=2, sort_keys=True) + '\n').encode()
          verified(japanese, 'd51687c2a30774b8008e41a655098c1d638b24283fb678f272e2b3685a1bc28e')
          pathlib.Path('src/i18n/locales/ja.json').write_bytes(japanese)
          shas = '''2a5d55603d628c292569cd9579ec378eebc0390e
          aa7f18f4fb5a7398f3cc500cb587fbbc209b30c5
          6cbaaca42379ffc380c7f0803497a76d41244a6d
          8c4d9ee0adcf62e0304599112b8057a41149067a
          fd17e446ce2ad518940ce1ed94395e6886a28488
          a275f818ec733cc63b151a71f6b7b31fc2afc343
          e48fce3d2791ef4e8f28a7a146e4270ba3a2fbff
          ab19716c5aecd3f38be87a5d92c1a83f77e1cf59
          d0ddaf1efa430b373324e18ab57265c17b23b879'''.split()
          compressed = b''
          for sha in shas:
              req = urllib.request.Request('https://api.github.com/repos/cmdr-chara/speedtest-cli/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  obj = json.load(response)
              part = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              compressed += part
          verified(compressed, '7343c7a8247bf700df74cfc028144da2da0323e270041993e8d41c258aad5abd')
          patch = verified(lzma.decompress(compressed), '7fb8101248a326f927840a1a1ca24dffd839c6d3725f09c77843117bbce3791d')
          # difflib's new-file hunks need Git mode metadata; source bytes do not change.
          patch = re.sub(rb'(diff --git [^\n]+\n)(--- /dev/null\n)', rb'\1new file mode 100644\n\2', patch)
          verified(patch, '1aed88cf0b175c18f66776fe1c0c1172b2e16e8c5beb76d913a20186943db1fa')
          pathlib.Path('/tmp/localization-delta.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/localization-delta.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/localization-delta.patch'], check=True)
          for name in ['recover-localization.yml', 'publish-localization.yml']:
              pathlib.Path('.github/workflows', name).unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'ead292f35887ac27e1b8fdcddb073395095262ce', 'tree differs from locally tested source: ' + tree
          print('Recovered complete implementation; exact source tree:', tree)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format, lint, full Rust tests, and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cargo fmt --all -- --check 2>&1 | tee verification/format.txt
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee verification/clippy.txt
          cargo test --locked --all-features 2>&1 | tee verification/tests.txt
          cargo build --locked --bin speedtest 2>&1 | tee verification/build.txt
      - name: Real CLI and terminal workflows using loopback only
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/cli_smoke.py 2>&1 | tee verification/cli-run.txt
          python .github/scripts/cockpit_smoke.py 2>&1 | tee verification/cockpit-run.txt
          python .github/scripts/localization_smoke.py 2>&1 | tee verification/localization-run.txt
          python .github/scripts/test_package_release.py 2>&1 | tee verification/packaging.txt
      - name: Commit verified source to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 'ead292f35887ac27e1b8fdcddb073395095262ce'
          git diff --exit-code
          CURRENT="$(git ls-remote origin refs/heads/feat/localized-cockpit | cut -f1)"
          test "$CURRENT" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: localize the cockpit and finish readable terminal workflows'
          git rev-parse HEAD > verification/candidate.txt
          git rev-parse 'HEAD^{tree}' >> verification/candidate.txt
          git push origin HEAD:refs/heads/feat/localized-cockpit
      - name: Preserve exact candidate verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-delivery-verification
          path: verification/
          retention-days: 7
