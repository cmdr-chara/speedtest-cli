name: Verify terminal readability

on:
  push:
    branches: [improve/terminal-native-readability]
    paths: [.github/workflows/readability-transfer.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/improve/terminal-native-readability'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/terminal-native-readability
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply the exact locally tested patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          base = 'cd2532fe37daf429eea738a0ec435666189c306b'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != base:
              raise SystemExit('Feature branch changed; refusing to apply onto another base')
          chunks = [
              'dabae7f0fe39ce84e8325bbf6a20cfcebc021b74',
              'f3d41d5ba242f8099977edebfab95fb789ecfe6e',
              '0f05326d66b77bc89a0a840394095d4bcd464ea4',
              'ecaf54660cc38c5f3be96632970e790e9180d9d5',
              'c0d0e16bedb4e52e16edc6783d90fe86e1377bb8',
              'dc2c4841e05bc1ef66c7ec81cb0f26619f44391f',
              '345cfea173c374b687a097cc4bf66c32b6ebd1ae',
              'fd0d0b0a1203924dd1cd1dff8d6740d4b5127a09',
              '7eb5579ec354414a381c7909e8a9c66f9c81beab',
              'd3c138d6a3d327d7df7973a52e9efbc116b9afe2',
              '25a926c292a09799c699b3687ff881c9eb1c3bdb',
              'd38699faf659bb8c38fbb6a0bea162b35904f887',
              '28b8691a8a597f8aa4d652dfefbdcdcb6b0fc084',
          ]
          payload = bytearray()
          for sha in chunks:
              response = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/cmdr-chara/speedtest-cli/git/blobs/{sha}'
              ]))
              part = base64.b64decode(response['content'])
              actual = hashlib.sha1(f'blob {len(part)}\0'.encode() + part).hexdigest()
              if actual != sha:
                  raise SystemExit('Blob integrity check failed')
              payload.extend(part)
          expected = '47672753c05b1200e37e196e6a0f1cda9cf20d94c08cd22a4f92c87d8db178d8'
          if len(payload) != 22663 or hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit('Patch integrity check failed')
          patch = gzip.decompress(payload)
          if len(patch) != 88100:
              raise SystemExit('Unexpected patch size')
          path = Path('/tmp/readability.patch')
          path.write_bytes(patch)
          allowed = {
              '.github/scripts/cli_smoke.py', '.github/scripts/cockpit_smoke.py',
              'README.md', 'docs/network-cockpit.md', 'src/tui/cockpit/mod.rs',
              'src/tui/cockpit/state.rs', 'src/tui/cockpit/tests.rs',
              'src/tui/cockpit/theme.rs', 'src/tui/cockpit/view.rs',
              'src/tui/mod.rs', 'src/tui/numerals.rs',
              'src/tui/speedometer.rs', 'src/tui/speedometer/gauge.rs',
          }
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(path)], text=True)
          paths = {line.split('\t', 2)[2] for line in stats.splitlines()}
          if paths != allowed:
              raise SystemExit('Patch write scope differs from the reviewed implementation')
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          print('Applied hash-verified patch to the original base; 13 reviewed files')
          PY
      - name: Format, Clippy, full Rust tests, and build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification
          cargo fmt --all -- --check 2>&1 | tee verification/format.txt
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee verification/clippy.txt
          cargo test --locked --all-features 2>&1 | tee verification/rust-tests.txt
          cargo build --locked --bin speedtest 2>&1 | tee verification/build.txt
      - name: CLI and terminal lifecycle checks using loopback only
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/cli_smoke.py 2>&1 | tee verification/cli-run.txt
          python .github/scripts/cockpit_smoke.py 2>&1 | tee verification/cockpit-run.txt
          python .github/scripts/test_package_release.py 2>&1 | tee verification/packaging.txt
          git diff --check
      - name: Commit only verified implementation and remove this transfer workflow
        shell: bash
        run: |
          git add -- .github/scripts/cli_smoke.py .github/scripts/cockpit_smoke.py README.md docs/network-cockpit.md src/tui/cockpit/mod.rs src/tui/cockpit/state.rs src/tui/cockpit/tests.rs src/tui/cockpit/theme.rs src/tui/cockpit/view.rs src/tui/mod.rs src/tui/numerals.rs src/tui/speedometer.rs src/tui/speedometer/gauge.rs
          git rm -- .github/workflows/readability-transfer.yml
          test "$(git write-tree)" = '843e87a51d567ae6385eaaddffa10a2313cd191a'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: adapt cockpit colors and improve terminal readability'
          git push origin HEAD:refs/heads/improve/terminal-native-readability
          git rev-parse HEAD > verification/candidate.txt
          git rev-parse HEAD^{tree} >> verification/candidate.txt
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readability-verification
          path: verification/
          if-no-files-found: warn
          retention-days: 7
