name: Format v0.5 branch

on:
  push:
    branches:
      - agent/v0.5-network-lab

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.5-network-lab
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- '*.rs'; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' 'src/**/*.rs'
          git commit -m "Format v0.5 Rust sources"
          git push origin HEAD:agent/v0.5-network-lab
