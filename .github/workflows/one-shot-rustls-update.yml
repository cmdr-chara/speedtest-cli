name: One-shot rustls security update

on:
  push:
    branches:
      - improve/engine-performance-and-deadlines
    paths:
      - .github/workflows/one-shot-rustls-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/engine-performance-and-deadlines
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"

      - name: Update rustls to the patched release
        shell: bash
        run: |
          cargo update -p rustls --precise 0.23.45
          cargo tree --locked -i rustls
          grep -A2 '^name = "rustls"$' Cargo.lock | grep -q '^version = "0.23.45"$'

      - name: Verify locked build resolves
        shell: bash
        run: cargo check --locked --all-features

      - name: Commit lockfile update and remove this workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-rustls-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --check
          git commit -m "fix(deps): update rustls to 0.23.45"
          git push origin HEAD:improve/engine-performance-and-deadlines
