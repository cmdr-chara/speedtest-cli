name: Localization workspace
on:
  push:
    branches: [feat/localized-cockpit]
    paths: [.github/workflows/locale-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Package source and documentation runner
        run: |
          mkdir -p /tmp/locale-workspace
          git bundle create /tmp/locale-workspace/source.bundle HEAD
          cp "$(rustup which rustdoc)" /tmp/locale-workspace/rustdoc
          rustc --version > /tmp/locale-workspace/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: locale-workspace
          path: /tmp/locale-workspace/
          retention-days: 1
