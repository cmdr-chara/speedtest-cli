name: Wire v0.5 branch

on:
  push:
    branches:
      - agent/v0.5-network-lab

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.5-network-lab
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire modules and backend fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def require_replace(text, old, new, name):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"anchor not found: {name}")
              return text.replace(old, new, 1)

          # DNS module declaration.
          p = Path("src/dns/mod.rs")
          t = p.read_text()
          if "pub mod doh;" not in t:
              t = t.replace("pub mod system;", "pub mod doh;\npub mod system;", 1)
          p.write_text(t)

          # Cloudflare adaptive chunking.
          p = Path("src/engine/cloudflare.rs")
          t = p.read_text()
          t = require_replace(
              t,
              "const DOWNLOAD_CHUNK_BYTES: u64 = 250_000_000;\nconst UPLOAD_CHUNK_BYTES: usize = 50_000_000;",
              "const DOWNLOAD_CHUNK_LADDER: [u64; 4] = [95_000_000, 25_000_000, 10_000_000, 1_000_000];\nconst UPLOAD_CHUNK_BYTES: usize = 25_000_000;\nconst MIN_UPLOAD_CHUNK_BYTES: usize = 1_000_000;",
              "Cloudflare constants",
          )

          if "DOWNLOAD_CHUNK_LADDER[chunk_index]" not in t:
              a = t.index("async fn download_worker(")
              b = t.index("async fn upload_worker(", a)
              new = '''async fn download_worker(client: Client, total: Arc<AtomicU64>, deadline: Instant) -> Result<()> {
              let mut rate_limit_retries = 0;
              let mut chunk_index = 1_usize;
              let mut minimum_chunk_index = 0_usize;

              while Instant::now() < deadline {
                  let request_bytes = DOWNLOAD_CHUNK_LADDER[chunk_index];
                  let request_started = Instant::now();
                  let response = tokio::select! {
                      result = client
                          .get(DOWNLOAD_URL)
                          .query(&[("bytes", request_bytes)])
                          .header("accept", "application/octet-stream")
                          .header("cache-control", "no-store")
                          .send() => result.context("download request failed")?,
                      _ = sleep_until(deadline) => break,
                  };

                  if response.status() == StatusCode::TOO_MANY_REQUESTS {
                      rate_limit_retries += 1;
                      if rate_limit_retries > MAX_RATE_LIMIT_RETRIES { break; }
                      if !sleep_before_deadline(rate_limit_delay(&response, rate_limit_retries), deadline).await { break; }
                      continue;
                  }

                  if matches!(response.status(), StatusCode::FORBIDDEN | StatusCode::PAYLOAD_TOO_LARGE | StatusCode::BAD_REQUEST) {
                      if chunk_index + 1 < DOWNLOAD_CHUNK_LADDER.len() {
                          chunk_index += 1;
                          minimum_chunk_index = minimum_chunk_index.max(chunk_index);
                          continue;
                      }
                      return Err(anyhow!(
                          "Cloudflare rejected even a {} byte download probe with {}; the public endpoint may be blocking this client or network",
                          request_bytes,
                          response.status()
                      ));
                  }

                  rate_limit_retries = 0;
                  let response = response.error_for_status().context("download endpoint returned an error")?;
                  let mut body = response.bytes_stream();
                  let mut completed = true;
                  loop {
                      let next = tokio::select! {
                          chunk = body.next() => chunk,
                          _ = sleep_until(deadline) => { completed = false; None },
                      };
                      match next {
                          Some(Ok(chunk)) => { total.fetch_add(chunk.len() as u64, Ordering::Relaxed); }
                          Some(Err(error)) => return Err(error).context("download stream failed"),
                          None => break,
                      }
                      if Instant::now() >= deadline { completed = false; break; }
                  }

                  if completed && request_started.elapsed() < Duration::from_millis(700) && chunk_index > minimum_chunk_index {
                      chunk_index -= 1;
                  }
              }
              Ok(())
          }

          '''
              t = t[:a] + new + t[b:]

          if "let mut payload = payload;" not in t:
              a = t.index("async fn upload_worker(")
              b = t.index("async fn measure_loaded_latency(", a)
              new = '''async fn upload_worker(
              client: Client,
              total: Arc<AtomicU64>,
              payload: Bytes,
              deadline: Instant,
          ) -> Result<()> {
              let mut rate_limit_retries = 0;
              let mut payload = payload;

              while Instant::now() < deadline {
                  let response = tokio::select! {
                      result = client
                          .post(UPLOAD_URL)
                          .header("content-type", "application/octet-stream")
                          .header("cache-control", "no-store")
                          .body(payload.clone())
                          .send() => Some(result.context("upload request failed")?),
                      _ = sleep_until(deadline) => None,
                  };
                  let Some(response) = response else { break; };

                  if response.status() == StatusCode::TOO_MANY_REQUESTS {
                      rate_limit_retries += 1;
                      if rate_limit_retries > MAX_RATE_LIMIT_RETRIES { break; }
                      if !sleep_before_deadline(rate_limit_delay(&response, rate_limit_retries), deadline).await { break; }
                      continue;
                  }
                  if matches!(response.status(), StatusCode::FORBIDDEN | StatusCode::PAYLOAD_TOO_LARGE)
                      && payload.len() > MIN_UPLOAD_CHUNK_BYTES
                  {
                      let next_len = (payload.len() / 2).max(MIN_UPLOAD_CHUNK_BYTES);
                      payload = payload.slice(..next_len);
                      continue;
                  }
                  rate_limit_retries = 0;
                  response.error_for_status().context("upload endpoint returned an error")?;
                  total.fetch_add(payload.len() as u64, Ordering::Relaxed);
              }
              Ok(())
          }

          '''
              t = t[:a] + new + t[b:]
          p.write_text(t)

          # Main imports.
          p = Path("src/main.rs")
          t = p.read_text()
          if "InternetBackendArg" not in t.split("compare as comparison", 1)[0]:
              t = re.sub(
                  r"    cli::\{.*?\n    \},\n    compare as comparison,",
                  '''    cli::{
                      Cli, Command, CompareArgs, DnsArgs, DnsBenchmarkArgs, DnsBenchmarkProfileArg,
                      DnsCommand, DnsListArgs, DnsOptimizeArgs, DnsProtocolArg, DnsResetArgs,
                      DnsRollbackArgs, DnsSetArgs, DnsShowArgs, DnsTestArgs, DoctorArgs, HistoryArgs,
                      InternetBackendArg, LanArgs, LossArgs, OutputFormat, ServeArgs, StabilityArgs,
                      StatsArgs, VerifyArgs, WifiArgs,
                  },
                  compare as comparison,''',
                  t,
                  count=1,
                  flags=re.S,
              )
          t = require_replace(
              t,
              "    engine::{cloudflare::CloudflareEngine, EngineConfig, EngineEvent},",
              '''    engine::{
                  cloudflare::CloudflareEngine, internet::InternetEngine, librespeed::LibreSpeedEngine,
                  EngineConfig, EngineEvent,
              },''',
              "main engine import",
          )
          t = require_replace(
              t,
              "    model::TestResult,\n    stability::{self, StabilityResult},\n    storage, tui,",
              "    lan, loss,\n    model::TestResult,\n    stability::{self, StabilityResult},\n    storage, tui, verify, wifi,",
              "main module import",
          )
          t = require_replace(
              t,
              "        Some(Command::Doctor(args)) => run_doctor_command(args).await,\n        None => run_speedtest(cli).await,",
              "        Some(Command::Doctor(args)) => run_doctor_command(args).await,\n        Some(Command::Loss(args)) => run_loss_command(args).await,\n        Some(Command::Wifi(args)) => run_wifi_command(args),\n        Some(Command::Verify(args)) => run_verify_command(args).await,\n        Some(Command::Serve(args)) => run_serve_command(args).await,\n        Some(Command::Lan(args)) => run_lan_command(args).await,\n        None => run_speedtest(cli).await,",
              "main command dispatch",
          )
          t = require_replace(
              t,
              "    let engine = CloudflareEngine::new(config)?;",
              '''    let engine = match cli.backend {
                  InternetBackendArg::Cloudflare => InternetEngine::Cloudflare(CloudflareEngine::new(config)?),
                  InternetBackendArg::Librespeed => InternetEngine::LibreSpeed(LibreSpeedEngine::new(
                      config,
                      cli.librespeed_server.as_deref(),
                  )?),
              };''',
              "backend selection",
          )
          t = require_replace(
              t,
              "    let result = dns::benchmark(dns_profile(args.profile), usize::from(args.queries)).await?;",
              '''    let result = match args.protocol {
                  DnsProtocolArg::Udp => dns::benchmark(dns_profile(args.profile), usize::from(args.queries)).await?,
                  DnsProtocolArg::Doh => dns::doh::benchmark(dns_profile(args.profile), usize::from(args.queries)).await?,
              };''',
              "DNS protocol dispatch",
          )
          t = require_replace(
              t,
              '''        let engine = CloudflareEngine::new(EngineConfig {
                  streams: 2,
                  phase_duration: Duration::from_secs(8),
              })?;
              let result = run_non_interactive(&engine)''',
              '''        let engine = InternetEngine::Cloudflare(CloudflareEngine::new(EngineConfig {
                  streams: 2,
                  phase_duration: Duration::from_secs(8),
              })?);
              let result = run_non_interactive(&engine)''',
              "doctor backend wrapper",
          )
          t = require_replace(t, "async fn run_non_interactive(engine: &CloudflareEngine)", "async fn run_non_interactive(engine: &InternetEngine)", "non-interactive type")
          t = require_replace(t, "async fn run_interactive(engine: CloudflareEngine, fps: u16)", "async fn run_interactive(engine: InternetEngine, fps: u16)", "interactive type")

          if "async fn run_loss_command" not in t:
              marker = "fn run_compare_command(args: CompareArgs) -> Result<()> {"
              block = '''async fn run_loss_command(args: LossArgs) -> Result<()> {
              let result = loss::measure(&args.target, args.count).await?;
              if args.json { println!("{}", result.pretty_json()?); } else { print_packet_loss(&result); }
              Ok(())
          }

          fn run_wifi_command(args: WifiArgs) -> Result<()> {
              let result = wifi::inspect(args.interface.as_deref())?;
              if args.json { println!("{}", result.pretty_json()?); } else { print_wifi(&result); }
              Ok(())
          }

          async fn run_verify_command(args: VerifyArgs) -> Result<()> {
              let report = verify::run(
                  EngineConfig {
                      streams: usize::from(args.streams),
                      phase_duration: Duration::from_secs(args.duration),
                  },
                  args.librespeed_server.as_deref(),
              ).await?;
              if args.json { println!("{}", report.pretty_json()?); } else { print_verify(&report); }
              Ok(())
          }

          async fn run_serve_command(args: ServeArgs) -> Result<()> {
              println!("LAN SPEEDTEST SERVER");
              println!("  Listening: {}", args.bind);
              println!("  Client:    speedtest lan <this-host>:{}", args.bind.port());
              println!("  Stop with Ctrl+C.");
              lan::serve(args.bind).await
          }

          async fn run_lan_command(args: LanArgs) -> Result<()> {
              let result = lan::run(
                  args.server,
                  lan::LanConfig {
                      streams: usize::from(args.streams),
                      phase_duration: Duration::from_secs(args.duration),
                  },
              ).await?;
              if args.json { println!("{}", result.pretty_json()?); } else { print_plain(&result); }
              Ok(())
          }

          '''
              t = t.replace(marker, block + marker, 1)

          if "fn print_packet_loss" not in t:
              marker = "fn print_stability(result: &StabilityResult) {"
              block = '''fn print_packet_loss(result: &loss::PacketLossResult) {
              println!("ICMP PACKET LOSS");
              println!();
              println!("  Target:          {}", result.target);
              println!("  Sent/received:   {} / {}", result.packets_sent, result.packets_received);
              println!("  Lost:            {} ({:.2}%)", result.packets_lost, result.loss_percent);
              if let Some(rtt) = &result.rtt {
                  println!("  RTT median:      {:.1} ms", rtt.median_ms);
                  println!("  RTT p95 / p99:   {:.1} / {:.1} ms", rtt.p95_ms, rtt.p99_ms);
                  println!("  RTT max:         {:.1} ms", rtt.max_ms);
              }
              println!();
              println!("  Note: {}", result.caveat);
          }

          fn print_wifi(result: &wifi::WifiSnapshot) {
              println!("WI-FI DIAGNOSTICS");
              println!();
              if !result.available {
                  println!("  No active Wi-Fi link detected.");
                  println!("  {}", result.detail);
                  return;
              }
              println!("  Interface:       {}", result.interface.as_deref().unwrap_or("unknown"));
              println!("  SSID:            {}", result.ssid.as_deref().unwrap_or("unknown"));
              if let Some(dbm) = result.signal_dbm { println!("  Signal:          {:.0} dBm", dbm); }
              if let Some(percent) = result.signal_percent { println!("  Signal quality:  {:.0}%", percent); }
              if let Some(band) = &result.band { println!("  Band:            {band}"); }
              if let Some(channel) = result.channel { println!("  Channel:         {channel}"); }
              if let Some(rate) = result.link_mbps { println!("  Link rate:       {:.0} Mbps", rate); }
              if let Some(radio) = &result.radio { println!("  Radio:           {radio}"); }
              println!("  Detail:          {}", result.detail);
          }

          fn print_verify(report: &verify::VerifyReport) {
              println!("MULTI-BACKEND VERIFICATION");
              println!();
              println!("                    CLOUDFLARE     LIBRESPEED");
              println!("  Download        {:>9.1} M     {:>9.1} M", report.cloudflare.download.mbps, report.librespeed.download.mbps);
              println!("  Upload          {:>9.1} M     {:>9.1} M", report.cloudflare.upload.mbps, report.librespeed.upload.mbps);
              println!("  Ping            {:>9.1} ms    {:>9.1} ms", report.cloudflare.latency.idle_ms, report.librespeed.latency.idle_ms);
              println!("  Jitter          {:>9.1} ms    {:>9.1} ms", report.cloudflare.latency.jitter_ms, report.librespeed.latency.jitter_ms);
              if let Some(loss) = &report.icmp_loss { println!("  ICMP loss       {:>9.2}%     independent reference", loss.loss_percent); }
              println!();
              println!("  Agreement:      {}", if report.consistent { "CONSISTENT" } else { "DIVERGENT" });
              println!("  {}", report.verdict);
              println!("  Highlight:      {}", report.comparison.highlight);
          }

          '''
              t = t.replace(marker, block + marker, 1)
          p.write_text(t)

          # Doctor enrichment.
          p = Path("src/doctor.rs")
          t = p.read_text()
          t = require_replace(t, "    dns,\n    model::{FindingSeverity, TestResult},", "    dns, loss,\n    model::{FindingSeverity, TestResult},\n    wifi,", "doctor imports")
          if "Internet-path packet loss is the clearest fault" not in t:
              marker = '''        if let Some(check) = self
                  .checks
                  .iter()
                  .find(|check| check.name == "DNS resolver" && check.status != DoctorStatus::Pass)'''
              block = '''        if let Some(check) = self.checks.iter().find(|check| {
                  check.name == "ICMP packet loss"
                      && matches!(check.status, DoctorStatus::Warning | DoctorStatus::Fail)
              }) {
                  self.diagnosis = "Internet-path packet loss is the clearest fault in this diagnostic pass".to_string();
                  self.recommendation = Some(format!(
                      "{} Repeat the loss test against another target and compare wired vs Wi-Fi before attributing it to the ISP.",
                      check.detail
                  ));
                  return;
              }

          '''
              t = t.replace(marker, block + marker, 1)

          if 'name: "Wi-Fi link"' not in t:
              marker = "    if let Some(gateway) = state.gateway {"
              block = '''    let wifi_check = tokio::task::spawn_blocking(|| wifi::inspect(None))
                  .await
                  .context("Wi-Fi diagnostic task panicked")?;
              checks.push(match wifi_check {
                  Ok(snapshot) if snapshot.available => DoctorCheck {
                      name: "Wi-Fi link".to_string(),
                      status: match snapshot.signal_dbm {
                          Some(dbm) if dbm >= -67.0 => DoctorStatus::Pass,
                          Some(dbm) if dbm >= -78.0 => DoctorStatus::Warning,
                          Some(_) => DoctorStatus::Fail,
                          None => DoctorStatus::Pass,
                      },
                      detail: format!(
                          "{}{}{}",
                          snapshot.ssid.as_deref().unwrap_or("associated"),
                          snapshot.signal_dbm.map_or(String::new(), |dbm| format!(", {dbm:.0} dBm")),
                          snapshot.link_mbps.map_or(String::new(), |rate| format!(", {rate:.0} Mbps link"))
                      ),
                      metric_ms: None,
                  },
                  Ok(snapshot) => DoctorCheck {
                      name: "Wi-Fi link".to_string(),
                      status: DoctorStatus::NotAvailable,
                      detail: snapshot.detail,
                      metric_ms: None,
                  },
                  Err(error) => DoctorCheck {
                      name: "Wi-Fi link".to_string(),
                      status: DoctorStatus::NotAvailable,
                      detail: format!("Wi-Fi diagnostics unavailable: {error:#}"),
                      metric_ms: None,
                  },
              });

              match loss::measure(loss::default_target(), 12).await {
                  Ok(result) => checks.push(DoctorCheck {
                      name: "ICMP packet loss".to_string(),
                      status: if result.loss_percent <= 1.0 { DoctorStatus::Pass } else if result.loss_percent <= 5.0 { DoctorStatus::Warning } else { DoctorStatus::Fail },
                      detail: format!("{:.2}% loss to {} ({} / {} replies)", result.loss_percent, result.target, result.packets_received, result.packets_sent),
                      metric_ms: result.rtt.as_ref().map(|rtt| rtt.median_ms),
                  }),
                  Err(error) => checks.push(DoctorCheck {
                      name: "ICMP packet loss".to_string(),
                      status: DoctorStatus::NotAvailable,
                      detail: format!("ICMP test unavailable: {error:#}"),
                      metric_ms: None,
                  }),
              }

              let mtu = tokio::task::spawn_blocking(mtu_1500_probe)
                  .await
                  .context("MTU probe task panicked")?;
              checks.push(match mtu {
                  Ok(Some(true)) => DoctorCheck { name: "MTU 1500 path".to_string(), status: DoctorStatus::Pass, detail: "1472-byte IPv4 ICMP payload succeeded with DF semantics".to_string(), metric_ms: None },
                  Ok(Some(false)) => DoctorCheck { name: "MTU 1500 path".to_string(), status: DoctorStatus::Warning, detail: "1500-byte IPv4 path probe did not pass; ICMP filtering or a smaller path MTU may be involved".to_string(), metric_ms: None },
                  Ok(None) => DoctorCheck { name: "MTU 1500 path".to_string(), status: DoctorStatus::NotAvailable, detail: "platform does not expose the required DF ping mode".to_string(), metric_ms: None },
                  Err(error) => DoctorCheck { name: "MTU 1500 path".to_string(), status: DoctorStatus::NotAvailable, detail: format!("MTU probe unavailable: {error:#}"), metric_ms: None },
              });

          '''
              t = t.replace(marker, block + marker, 1)

          if "fn mtu_1500_probe" not in t:
              marker = "fn gateway_ping(gateway: IpAddr) -> Result<Option<f64>> {"
              block = '''fn mtu_1500_probe() -> Result<Option<bool>> {
              #[cfg(target_os = "windows")]
              {
                  let output = Command::new("ping").args(["-n", "1", "-w", "1500", "-f", "-l", "1472", "1.1.1.1"]).output().context("failed to run Windows MTU ping")?;
                  return Ok(Some(output.status.success()));
              }
              #[cfg(target_os = "macos")]
              {
                  let output = Command::new("ping").args(["-c", "1", "-W", "1000", "-D", "-s", "1472", "1.1.1.1"]).output().context("failed to run macOS MTU ping")?;
                  return Ok(Some(output.status.success()));
              }
              #[cfg(all(unix, not(target_os = "macos")))]
              {
                  let output = Command::new("ping").args(["-c", "1", "-W", "1", "-M", "do", "-s", "1472", "1.1.1.1"]).output().context("failed to run Linux MTU ping")?;
                  return Ok(Some(output.status.success()));
              }
              #[allow(unreachable_code)]
              Ok(None)
          }

          '''
              t = t.replace(marker, block + marker, 1)
          p.write_text(t)
      - name: Format
        run: cargo fmt --all
      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "No wiring changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src
          git commit -m "Wire v0.5 network lab"
          git push origin HEAD:agent/v0.5-network-lab
