name: Format v0.4 branch

on:
  push:
    branches:
      - agent/v0.4-dns-doctor-compare

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.4-dns-doctor-compare

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply provider lookup lifetime fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/dns/mod.rs")
          source = path.read_text()
          old = "    let normalized = match id.to_ascii_lowercase().as_str() {"
          new = "    let lowercase = id.to_ascii_lowercase();\n    let normalized = match lowercase.as_str() {"
          if old in source:
              path.write_text(source.replace(old, new, 1))
          PY

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit branch corrections
        shell: bash
        run: |
          if git diff --quiet -- '*.rs'; then
            echo "Rust sources already corrected and formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/compare.rs \
            src/dns/mod.rs \
            src/dns/system.rs \
            src/dns_custom.rs \
            src/doctor.rs \
            src/main.rs \
            src/storage/mod.rs
          git commit -m "Fix DNS provider lookup lifetime"
          git push origin HEAD:agent/v0.4-dns-doctor-compare
