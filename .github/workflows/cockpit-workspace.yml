name: Cockpit workspace
on:
  push:
    branches: [feat/network-cockpit]
    paths: [.github/workflows/cockpit-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture source history without credentials
        run: git bundle create /tmp/cockpit-workspace.bundle HEAD refs/heads/feat/network-cockpit
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-workspace
          path: /tmp/cockpit-workspace.bundle
          retention-days: 1
