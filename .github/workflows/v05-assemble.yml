name: Assemble v0.5 branch

on:
  push:
    branches:
      - agent/v0.5-network-lab

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.5-network-lab

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Integrate v0.5 modules
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              a = text.find(start)
              b = text.find(end, a + len(start))
              if a < 0 or b < 0:
                  raise SystemExit(f"missing range anchor: {label}")
              return text[:a] + replacement.rstrip() + "\n\n" + text[b + 1:]

          # DNS-over-HTTPS child module.
          path = Path("src/dns/mod.rs")
          text = path.read_text()
          if not text.startswith("pub mod doh;\n"):
              text = text.replace("pub mod system;\n", "pub mod doh;\npub mod system;\n", 1)
          path.write_text(text)

          # Cloudflare: stop depending on one 250 MB object; ramp chunks and downshift on rejection.
          path = Path("src/engine/cloudflare.rs")
          text = path.read_text()
          text = replace_once(
              text,
              'const DOWNLOAD_CHUNK_BYTES: u64 = 250_000_000;\nconst UPLOAD_CHUNK_BYTES: usize = 50_000_000;',
              'const DOWNLOAD_CHUNK_LADDER: [u64; 4] = [95_000_000, 25_000_000, 10_000_000, 1_000_000];\nconst UPLOAD_CHUNK_BYTES: usize = 25_000_000;\nconst MIN_UPLOAD_CHUNK_BYTES: usize = 1_000_000;',
              "Cloudflare chunk constants",
          )

          new_download = r'''async fn download_worker(client: Client, total: Arc<AtomicU64>, deadline: Instant) -> Result<()> {
              let mut rate_limit_retries = 0;
              let mut chunk_index = 1_usize;
              let mut minimum_chunk_index = 0_usize;

              while Instant::now() < deadline {
                  let request_bytes = DOWNLOAD_CHUNK_LADDER[chunk_index];
                  let request_started = Instant::now();
                  let response = tokio::select! {
                      result = client
                          .get(DOWNLOAD_URL)
                          .query(&[("bytes", request_bytes)])
                          .header("accept", "application/octet-stream")
                          .header("cache-control", "no-store")
                          .send() => result.context("download request failed")?,
                      _ = sleep_until(deadline) => break,
                  };

                  if response.status() == StatusCode::TOO_MANY_REQUESTS {
                      rate_limit_retries += 1;
                      if rate_limit_retries > MAX_RATE_LIMIT_RETRIES {
                          break;
                      }
                      if !sleep_before_deadline(rate_limit_delay(&response, rate_limit_retries), deadline).await {
                          break;
                      }
                      continue;
                  }

                  if matches!(
                      response.status(),
                      StatusCode::FORBIDDEN | StatusCode::PAYLOAD_TOO_LARGE | StatusCode::BAD_REQUEST
                  ) {
                      if chunk_index + 1 < DOWNLOAD_CHUNK_LADDER.len() {
                          chunk_index += 1;
                          minimum_chunk_index = minimum_chunk_index.max(chunk_index);
                          continue;
                      }
                      return Err(anyhow!(
                          "Cloudflare rejected even a {} byte download probe with {}; the public endpoint may be blocking this client or network",
                          request_bytes,
                          response.status()
                      ));
                  }

                  rate_limit_retries = 0;
                  let response = response
                      .error_for_status()
                      .context("download endpoint returned an error")?;

                  let mut body = response.bytes_stream();
                  let mut completed = true;
                  loop {
                      let next = tokio::select! {
                          chunk = body.next() => chunk,
                          _ = sleep_until(deadline) => {
                              completed = false;
                              None
                          },
                      };

                      match next {
                          Some(Ok(chunk)) => {
                              total.fetch_add(chunk.len() as u64, Ordering::Relaxed);
                          }
                          Some(Err(error)) => return Err(error).context("download stream failed"),
                          None => break,
                      }

                      if Instant::now() >= deadline {
                          completed = false;
                          break;
                      }
                  }

                  if completed
                      && request_started.elapsed() < Duration::from_millis(700)
                      && chunk_index > minimum_chunk_index
                  {
                      chunk_index -= 1;
                  }
              }

              Ok(())
          }'''
          text = replace_between(
              text,
              "async fn download_worker(",
              "async fn upload_worker(",
              new_download,
              "Cloudflare download worker",
          )

          new_upload = r'''async fn upload_worker(
              client: Client,
              total: Arc<AtomicU64>,
              payload: Bytes,
              deadline: Instant,
          ) -> Result<()> {
              let mut rate_limit_retries = 0;
              let mut payload = payload;

              while Instant::now() < deadline {
                  let response = tokio::select! {
                      result = client
                          .post(UPLOAD_URL)
                          .header("content-type", "application/octet-stream")
                          .header("cache-control", "no-store")
                          .body(payload.clone())
                          .send() => Some(result.context("upload request failed")?),
                      _ = sleep_until(deadline) => None,
                  };

                  let Some(response) = response else {
                      break;
                  };

                  if response.status() == StatusCode::TOO_MANY_REQUESTS {
                      rate_limit_retries += 1;
                      if rate_limit_retries > MAX_RATE_LIMIT_RETRIES {
                          break;
                      }
                      if !sleep_before_deadline(rate_limit_delay(&response, rate_limit_retries), deadline).await {
                          break;
                      }
                      continue;
                  }

                  if matches!(response.status(), StatusCode::FORBIDDEN | StatusCode::PAYLOAD_TOO_LARGE)
                      && payload.len() > MIN_UPLOAD_CHUNK_BYTES
                  {
                      let next_len = (payload.len() / 2).max(MIN_UPLOAD_CHUNK_BYTES);
                      payload = payload.slice(..next_len);
                      continue;
                  }

                  rate_limit_retries = 0;
                  response
                      .error_for_status()
                      .context("upload endpoint returned an error")?;
                  total.fetch_add(payload.len() as u64, Ordering::Relaxed);
              }

              Ok(())
          }'''
          text = replace_between(
              text,
              "async fn upload_worker(",
              "async fn measure_loaded_latency(",
              new_upload,
              "Cloudflare upload worker",
          )
          path.write_text(text)

          # Main command wiring and pluggable backend.
          path = Path("src/main.rs")
          text = path.read_text()
          old_import = '''    cli::{
                  Cli, Command, CompareArgs, DnsArgs, DnsBenchmarkArgs, DnsBenchmarkProfileArg, DnsCommand,
                  DnsListArgs, DnsOptimizeArgs, DnsResetArgs, DnsRollbackArgs, DnsSetArgs, DnsShowArgs,
                  DnsTestArgs, DoctorArgs, HistoryArgs, OutputFormat, StabilityArgs, StatsArgs,
              },'''
          new_import = '''    cli::{
                  Cli, Command, CompareArgs, DnsArgs, DnsBenchmarkArgs, DnsBenchmarkProfileArg, DnsCommand,
                  DnsListArgs, DnsOptimizeArgs, DnsProtocolArg, DnsResetArgs, DnsRollbackArgs, DnsSetArgs,
                  DnsShowArgs, DnsTestArgs, DoctorArgs, HistoryArgs, InternetBackendArg, LanArgs, LossArgs,
                  OutputFormat, ServeArgs, StabilityArgs, StatsArgs, VerifyArgs, WifiArgs,
              },'''
          text = replace_once(text, old_import, new_import, "main CLI imports")
          text = replace_once(
              text,
              '    engine::{cloudflare::CloudflareEngine, EngineConfig, EngineEvent},',
              '    engine::{\n        cloudflare::CloudflareEngine, internet::InternetEngine, librespeed::LibreSpeedEngine,\n        EngineConfig, EngineEvent,\n    },',
              "main engine imports",
          )
          text = replace_once(
              text,
              '    model::TestResult,\n    stability::{self, StabilityResult},\n    storage, tui,',
              '    lan, loss,\n    model::TestResult,\n    stability::{self, StabilityResult},\n    storage, tui, verify, wifi,',
              "main module imports",
          )
          text = replace_once(
              text,
              '        Some(Command::Doctor(args)) => run_doctor_command(args).await,\n        None => run_speedtest(cli).await,',
              '        Some(Command::Doctor(args)) => run_doctor_command(args).await,\n        Some(Command::Loss(args)) => run_loss_command(args).await,\n        Some(Command::Wifi(args)) => run_wifi_command(args),\n        Some(Command::Verify(args)) => run_verify_command(args).await,\n        Some(Command::Serve(args)) => run_serve_command(args).await,\n        Some(Command::Lan(args)) => run_lan_command(args).await,\n        None => run_speedtest(cli).await,',
              "main command dispatch",
          )
          text = replace_once(
              text,
              '    let engine = CloudflareEngine::new(config)?;',
              '''    let engine = match cli.backend {
                  InternetBackendArg::Cloudflare => InternetEngine::Cloudflare(CloudflareEngine::new(config)?),
                  InternetBackendArg::Librespeed => InternetEngine::LibreSpeed(LibreSpeedEngine::new(
                      config,
                      cli.librespeed_server.as_deref(),
                  )?),
              };''',
              "main backend selection",
          )
          text = replace_once(
              text,
              '    let result = dns::benchmark(dns_profile(args.profile), usize::from(args.queries)).await?;',
              '''    let result = match args.protocol {
                  DnsProtocolArg::Udp => dns::benchmark(dns_profile(args.profile), usize::from(args.queries)).await?,
                  DnsProtocolArg::Doh => dns::doh::benchmark(dns_profile(args.profile), usize::from(args.queries)).await?,
              };''',
              "DoH benchmark dispatch",
          )
          old_doctor = '''        let engine = CloudflareEngine::new(EngineConfig {
                      streams: 2,
                      phase_duration: Duration::from_secs(8),
                  })?;
                  let result = run_non_interactive(&engine)
                      .await
                      .context("full doctor speed test failed")?;'''
          new_doctor = '''        let engine = InternetEngine::Cloudflare(CloudflareEngine::new(EngineConfig {
                      streams: 2,
                      phase_duration: Duration::from_secs(8),
                  })?);
                  let result = run_non_interactive(&engine)
                      .await
                      .context("full doctor speed test failed")?;'''
          text = replace_once(text, old_doctor, new_doctor, "doctor InternetEngine")
          text = replace_once(
              text,
              'async fn run_non_interactive(engine: &CloudflareEngine) -> Result<TestResult> {',
              'async fn run_non_interactive(engine: &InternetEngine) -> Result<TestResult> {',
              "non-interactive engine type",
          )
          text = replace_once(
              text,
              'async fn run_interactive(engine: CloudflareEngine, fps: u16) -> Result<TestResult> {',
              'async fn run_interactive(engine: InternetEngine, fps: u16) -> Result<TestResult> {',
              "interactive engine type",
          )

          command_functions = r'''
          async fn run_loss_command(args: LossArgs) -> Result<()> {
              let result = loss::measure(&args.target, args.count).await?;
              if args.json {
                  println!("{}", result.pretty_json()?);
              } else {
                  print_packet_loss(&result);
              }
              Ok(())
          }

          fn run_wifi_command(args: WifiArgs) -> Result<()> {
              let result = wifi::inspect(args.interface.as_deref())?;
              if args.json {
                  println!("{}", result.pretty_json()?);
              } else {
                  print_wifi(&result);
              }
              Ok(())
          }

          async fn run_verify_command(args: VerifyArgs) -> Result<()> {
              let report = verify::run(
                  EngineConfig {
                      streams: usize::from(args.streams),
                      phase_duration: Duration::from_secs(args.duration),
                  },
                  args.librespeed_server.as_deref(),
              )
              .await?;
              if args.json {
                  println!("{}", report.pretty_json()?);
              } else {
                  print_verify(&report);
              }
              Ok(())
          }

          async fn run_serve_command(args: ServeArgs) -> Result<()> {
              println!("LAN SPEEDTEST SERVER");
              println!("  Listening: {}", args.bind);
              println!("  Client:    speedtest lan <this-host>:{}", args.bind.port());
              println!("  Stop with Ctrl+C.");
              lan::serve(args.bind).await
          }

          async fn run_lan_command(args: LanArgs) -> Result<()> {
              let result = lan::run(
                  args.server,
                  lan::LanConfig {
                      streams: usize::from(args.streams),
                      phase_duration: Duration::from_secs(args.duration),
                  },
              )
              .await?;
              if args.json {
                  println!("{}", result.pretty_json()?);
              } else {
                  print_plain(&result);
              }
              Ok(())
          }

          '''
          marker = "fn run_compare_command(args: CompareArgs) -> Result<()> {"
          if "async fn run_loss_command" not in text:
              text = text.replace(marker, command_functions + marker, 1)

          printers = r'''
          fn print_packet_loss(result: &loss::PacketLossResult) {
              println!("ICMP PACKET LOSS");
              println!();
              println!("  Target:          {}", result.target);
              println!("  Sent/received:   {} / {}", result.packets_sent, result.packets_received);
              println!("  Lost:            {} ({:.2}%)", result.packets_lost, result.loss_percent);
              if let Some(rtt) = &result.rtt {
                  println!("  RTT median:      {:.1} ms", rtt.median_ms);
                  println!("  RTT p95 / p99:   {:.1} / {:.1} ms", rtt.p95_ms, rtt.p99_ms);
                  println!("  RTT max:         {:.1} ms", rtt.max_ms);
              }
              println!();
              println!("  Note: {}", result.caveat);
          }

          fn print_wifi(result: &wifi::WifiSnapshot) {
              println!("WI-FI DIAGNOSTICS");
              println!();
              if !result.available {
                  println!("  No active Wi-Fi link detected.");
                  println!("  {}", result.detail);
                  return;
              }
              println!("  Interface:       {}", result.interface.as_deref().unwrap_or("unknown"));
              println!("  SSID:            {}", result.ssid.as_deref().unwrap_or("unknown"));
              if let Some(dbm) = result.signal_dbm {
                  println!("  Signal:          {:.0} dBm", dbm);
              }
              if let Some(percent) = result.signal_percent {
                  println!("  Signal quality:  {:.0}%", percent);
              }
              if let Some(band) = &result.band {
                  println!("  Band:            {band}");
              }
              if let Some(channel) = result.channel {
                  println!("  Channel:         {channel}");
              }
              if let Some(rate) = result.link_mbps {
                  println!("  Link rate:       {:.0} Mbps", rate);
              }
              if let Some(radio) = &result.radio {
                  println!("  Radio:           {radio}");
              }
              println!("  Detail:          {}", result.detail);
          }

          fn print_verify(report: &verify::VerifyReport) {
              println!("MULTI-BACKEND VERIFICATION");
              println!();
              println!("                    CLOUDFLARE     LIBRESPEED");
              println!("  Download        {:>9.1} M     {:>9.1} M", report.cloudflare.download.mbps, report.librespeed.download.mbps);
              println!("  Upload          {:>9.1} M     {:>9.1} M", report.cloudflare.upload.mbps, report.librespeed.upload.mbps);
              println!("  Ping            {:>9.1} ms    {:>9.1} ms", report.cloudflare.latency.idle_ms, report.librespeed.latency.idle_ms);
              println!("  Jitter          {:>9.1} ms    {:>9.1} ms", report.cloudflare.latency.jitter_ms, report.librespeed.latency.jitter_ms);
              if let Some(loss) = &report.icmp_loss {
                  println!("  ICMP loss       {:>9.2}%     independent reference", loss.loss_percent);
              }
              println!();
              println!("  Agreement:      {}", if report.consistent { "CONSISTENT" } else { "DIVERGENT" });
              println!("  {}", report.verdict);
              println!("  Highlight:      {}", report.comparison.highlight);
          }

          '''
          marker = "fn print_stability(result: &StabilityResult) {"
          if "fn print_packet_loss" not in text:
              text = text.replace(marker, printers + marker, 1)
          path.write_text(text)

          # Doctor: add Wi-Fi, ICMP loss, and MTU sanity to the existing route/DNS/TCP/TLS pass.
          path = Path("src/doctor.rs")
          text = path.read_text()
          text = replace_once(
              text,
              'use crate::{\n    dns,\n    model::{FindingSeverity, TestResult},\n};',
              'use crate::{\n    dns, loss,\n    model::{FindingSeverity, TestResult},\n    wifi,\n};',
              "doctor imports",
          )

          diagnosis = r'''
                  if let Some(check) = self.checks.iter().find(|check| {
                      check.name == "ICMP packet loss"
                          && matches!(check.status, DoctorStatus::Warning | DoctorStatus::Fail)
                  }) {
                      self.diagnosis = "Internet-path packet loss is the clearest fault in this diagnostic pass".to_string();
                      self.recommendation = Some(format!(
                          "{} Repeat the loss test against another target and compare wired vs Wi-Fi before attributing it to the ISP.",
                          check.detail
                      ));
                      return;
                  }

          '''
          diag_marker = '        if let Some(check) = self\n            .checks\n            .iter()\n            .find(|check| check.name == "DNS resolver" && check.status != DoctorStatus::Pass)'
          if "Internet-path packet loss is the clearest fault" not in text:
              text = text.replace(diag_marker, diagnosis + diag_marker, 1)

          checks = r'''
              let wifi_check = tokio::task::spawn_blocking(|| wifi::inspect(None))
                  .await
                  .context("Wi-Fi diagnostic task panicked")?;
              checks.push(match wifi_check {
                  Ok(snapshot) if snapshot.available => {
                      let status = match snapshot.signal_dbm {
                          Some(dbm) if dbm >= -67.0 => DoctorStatus::Pass,
                          Some(dbm) if dbm >= -78.0 => DoctorStatus::Warning,
                          Some(_) => DoctorStatus::Fail,
                          None => DoctorStatus::Pass,
                      };
                      DoctorCheck {
                          name: "Wi-Fi link".to_string(),
                          status,
                          detail: format!(
                              "{}{}{}",
                              snapshot.ssid.as_deref().unwrap_or("associated"),
                              snapshot.signal_dbm.map_or(String::new(), |dbm| format!(", {dbm:.0} dBm")),
                              snapshot.link_mbps.map_or(String::new(), |rate| format!(", {rate:.0} Mbps link"))
                          ),
                          metric_ms: None,
                      }
                  }
                  Ok(snapshot) => DoctorCheck {
                      name: "Wi-Fi link".to_string(),
                      status: DoctorStatus::NotAvailable,
                      detail: snapshot.detail,
                      metric_ms: None,
                  },
                  Err(error) => DoctorCheck {
                      name: "Wi-Fi link".to_string(),
                      status: DoctorStatus::NotAvailable,
                      detail: format!("Wi-Fi diagnostics unavailable: {error:#}"),
                      metric_ms: None,
                  },
              });

              match loss::measure(loss::default_target(), 12).await {
                  Ok(result) => checks.push(DoctorCheck {
                      name: "ICMP packet loss".to_string(),
                      status: if result.loss_percent <= 1.0 {
                          DoctorStatus::Pass
                      } else if result.loss_percent <= 5.0 {
                          DoctorStatus::Warning
                      } else {
                          DoctorStatus::Fail
                      },
                      detail: format!(
                          "{:.2}% loss to {} ({} / {} replies)",
                          result.loss_percent, result.target, result.packets_received, result.packets_sent
                      ),
                      metric_ms: result.rtt.as_ref().map(|rtt| rtt.median_ms),
                  }),
                  Err(error) => checks.push(DoctorCheck {
                      name: "ICMP packet loss".to_string(),
                      status: DoctorStatus::NotAvailable,
                      detail: format!("ICMP test unavailable: {error:#}"),
                      metric_ms: None,
                  }),
              }

              let mtu = tokio::task::spawn_blocking(mtu_1500_probe)
                  .await
                  .context("MTU probe task panicked")?;
              checks.push(match mtu {
                  Ok(Some(true)) => DoctorCheck {
                      name: "MTU 1500 path".to_string(),
                      status: DoctorStatus::Pass,
                      detail: "1472-byte IPv4 ICMP payload succeeded with DF semantics".to_string(),
                      metric_ms: None,
                  },
                  Ok(Some(false)) => DoctorCheck {
                      name: "MTU 1500 path".to_string(),
                      status: DoctorStatus::Warning,
                      detail: "1500-byte IPv4 path probe did not pass; ICMP filtering or a smaller path MTU may be involved".to_string(),
                      metric_ms: None,
                  },
                  Ok(None) => DoctorCheck {
                      name: "MTU 1500 path".to_string(),
                      status: DoctorStatus::NotAvailable,
                      detail: "platform does not expose the required DF ping mode".to_string(),
                      metric_ms: None,
                  },
                  Err(error) => DoctorCheck {
                      name: "MTU 1500 path".to_string(),
                      status: DoctorStatus::NotAvailable,
                      detail: format!("MTU probe unavailable: {error:#}"),
                      metric_ms: None,
                  },
              });

          '''
          marker = "    if let Some(gateway) = state.gateway {"
          if 'name: "Wi-Fi link"' not in text:
              text = text.replace(marker, checks + marker, 1)

          mtu_helper = r'''
          fn mtu_1500_probe() -> Result<Option<bool>> {
              #[cfg(target_os = "windows")]
              {
                  let output = Command::new("ping")
                      .args(["-n", "1", "-w", "1500", "-f", "-l", "1472", "1.1.1.1"])
                      .output()
                      .context("failed to run Windows MTU ping")?;
                  return Ok(Some(output.status.success()));
              }

              #[cfg(target_os = "macos")]
              {
                  let output = Command::new("ping")
                      .args(["-c", "1", "-W", "1000", "-D", "-s", "1472", "1.1.1.1"])
                      .output()
                      .context("failed to run macOS MTU ping")?;
                  return Ok(Some(output.status.success()));
              }

              #[cfg(all(unix, not(target_os = "macos")))]
              {
                  let output = Command::new("ping")
                      .args(["-c", "1", "-W", "1", "-M", "do", "-s", "1472", "1.1.1.1"])
                      .output()
                      .context("failed to run Linux MTU ping")?;
                  return Ok(Some(output.status.success()));
              }

              #[allow(unreachable_code)]
              Ok(None)
          }

          '''
          marker = "fn gateway_ping(gateway: IpAddr) -> Result<Option<f64>> {"
          if "fn mtu_1500_probe" not in text:
              text = text.replace(marker, mtu_helper + marker, 1)
          path.write_text(text)

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "v0.5 integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src
          git commit -m "Integrate v0.5 network lab"
          git push origin HEAD:agent/v0.5-network-lab
