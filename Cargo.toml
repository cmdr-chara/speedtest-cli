[package]
name = "speedtest-cli"
version = "0.7.0"
edition = "2021"
description = "A fast, polished terminal speed test written in Rust"
license-file = "LICENSE"
repository = "https://github.com/cmdr-chara/speedtest-cli"
readme = "README.md"
keywords = ["speedtest", "network", "cli", "tui", "ratatui"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "speedtest"
path = "src/bin/speedtest.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
csv = "1"
futures-util = "0.3"
# Exact wrapped-line counts keep scroll positions valid across terminal resizes.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "http3"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "signal", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
